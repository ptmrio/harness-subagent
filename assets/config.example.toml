# Copy to ~/.config/harness-subagent/config.toml
# See references/user-config.md. Do not put this file inside the skill clone.
# Values: claude | codex | grok | cursor | agy | gemini | opencode | droid
#     or: self | orchestrator | parent | you  (parent does the job; no spawn)
# These assignments are suggestions. Change them. The skill has no job→harness map.
# cursor from a Cursor parent is skipped (same family), not treated as self.

[defaults]
spec = "claude"
spec-ui = "claude"
plan = "claude"
plan-ui = "claude"
implement = "claude"
implement-ui = "claude"
writer = "grok"            # sustained prose; suggestion only — not claude
research = "codex"         # lookup / competitive / current docs
code-review-task = "codex"
code-review-adversarial = "codex"
code-review-visual = "codex"   # Playwright / live UI + shots; spawn --mode visual

# Extra keys are optional named labels. Used only when you say that word this turn.

[models]
claude = "opus"
codex = "gpt-5.6-sol"
grok = "grok-4.6"

[effort]
claude = "xhigh"
codex = "xhigh"
grok = "xhigh"
